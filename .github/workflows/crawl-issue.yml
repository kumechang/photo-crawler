name: Crawl photos from issue

# 手動実行専用。Actionsタブから issue_number を指定して実行する。
# 指定したissueの本文全体を1つのキーワードとして扱い、各フリー素材サイトを検索して
# 画像を photos/<keyword>/ にコミットし、結果をissueにコメントしてクローズする。
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'キーワードが書かれているissueの番号'
        required: true
      limit:
        description: 'サイトごとの取得上限枚数'
        required: false
        default: '15'

permissions:
  contents: write
  issues: write

concurrency:
  group: photo-crawl-issue-${{ github.event.inputs.issue_number }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve keyword from issue body
        id: keyword
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed(`issue_number が不正です: ${process.env.ISSUE_NUMBER}`);
              return;
            }
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            // スペースは単語区切りではなく、本文全体で1つのキーワードとして扱う。
            // 改行だけ空白に統一し、前後の空白を削る。
            const keyword = (issue.body || '').replace(/\s+/g, ' ').trim();
            if (!keyword) {
              core.setFailed(`issue #${issueNumber} の本文が空です。`);
              return;
            }
            core.setOutput('value', keyword);
            core.setOutput('issue_number', String(issueNumber));
        env:
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}

      - name: Run crawler
        env:
          KEYWORD: ${{ steps.keyword.outputs.value }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: node src/index.js --keyword "$KEYWORD" --limit "$LIMIT" --out photos

      - name: Commit and push results
        id: commit
        env:
          KEYWORD: ${{ steps.keyword.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add photos
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add photos for keyword: ${KEYWORD}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on issue and close
        uses: actions/github-script@v7
        env:
          KEYWORD: ${{ steps.keyword.outputs.value }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        with:
          script: |
            const issueNumber = Number('${{ steps.keyword.outputs.issue_number }}');
            const keyword = process.env.KEYWORD;
            const changed = process.env.CHANGED === 'true';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = changed
              ? [
                  `キーワード \`${keyword}\` で画像収集が完了し、\`photos/\` 配下にコミットしました。`,
                  '',
                  `実行ログ: ${runUrl}`,
                ].join('\n')
              : [
                  `キーワード \`${keyword}\` で検索しましたが、新規に取得できた画像はありませんでした。`,
                  '各サイトへのアクセス失敗、または既に取得済みの可能性があります。',
                  '',
                  `実行ログ: ${runUrl}`,
                ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
            });
